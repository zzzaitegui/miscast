spring.application.name=miscast-backend
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/miscast}
spring.datasource.username=${POSTGRES_USER:miscast}
spring.datasource.password=${POSTGRES_PASSWORD:miscast}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
miscast.jwt.secret=${MISCAST_JWT_SECRET:changeme-at-least-32-characters-long-dev-key}
miscast.jwt.expiration=86400000

# TMDB
tmdb.api.key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3

# Spring Data REST — disable auto-exposure of repositories
spring.data.rest.detection-strategy=annotated

# Jackson — exclude null fields from responses
spring.jackson.default-property-inclusion=non_null

# Spring HATEOAS — prevent Spring Data REST from hijacking application/json with HAL format
spring.hateoas.use-hal-as-default-json-media-type=false

# Rating transformation — tanh curve: y = x + a * tanh(b * (x - c))
# Center (c): rating that stays unchanged. Amplitude (a): max expansion. Steepness (b): curve aggressiveness.
rating.transform.center=7.0
rating.transform.amplitude=3.0
rating.transform.steepness=0.1

# OpenAPI / Swagger UI — accessible at /api/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.path=/swagger-ui.html
# Disable springdoc HATEOAS/DataRest integrations — incompatible with Spring Boot 4.x
spring.autoconfigure.exclude=org.springdoc.core.configuration.SpringDocHateoasConfiguration,org.springdoc.core.configuration.SpringDocDataRestConfiguration
